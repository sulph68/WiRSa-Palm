; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Pick one default environment (pin layout): esp32s3 = generic board, t7s3 = LilyGO T7-S3
default_envs = esp32s3
;default_envs = t7s3

; ---------------------------------------------------------------
; Generic ESP32-S3 board: OLED, four buttons, an RGB (WS2812) status LED on
; GPIO48, 16 MB flash, 8 MB octal PSRAM, console on a USB-serial chip.
; Build with:  pio run -e esp32s3
; ---------------------------------------------------------------
[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; upload_port = /dev/tty.wchusbserial58FA0770291
upload_protocol = esptool

; Serial Monitor settings
; monitor_port = /dev/tty.wchusbserial58FA0770291
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build settings
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DWIRSA_LED_NEOPIXEL=48
    -DWIRSA_DEEP_SLEEP

; Library dependencies
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    contrem/arduino-timer@^3.0.1
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.3
    WebServer

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_vdisk.csv
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L


; ---------------------------------------------------------------
; LilyGO T7-S3: 16 MB flash, 8 MB octal PSRAM, native USB, no OLED or buttons.
; Build with:  pio run -e t7s3
; ---------------------------------------------------------------
[env:t7s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DWIRSA_BOARD_T7S3
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    contrem/arduino-timer@^3.0.1
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.3
    WebServer

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_vdisk.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
